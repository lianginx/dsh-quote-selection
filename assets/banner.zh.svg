<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EDF1FA"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F5FC"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E2A4A" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8CA0C6"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="878" height="298" rx="18" fill="url(#bg)" stroke="#DBE2F0"/>

  <!-- Card 1 -->
  <g>
    <rect x="40" y="64" width="232" height="176" rx="12" fill="#FFFFFF" stroke="#DFE6F2"/>
    <circle cx="66" cy="92" r="9" fill="#C9D6EF"/>
    <rect x="84" y="88" width="90" height="8" rx="4" fill="#E4EAF5"/>
    <text x="58" y="128" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="12.5" fill="#3D4A63">这是回复里关键的一段:</text>
    <rect x="53" y="138" width="206" height="21" rx="4" fill="#BCD2FF"/>
    <text x="57" y="153" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="12.5" font-weight="600" fill="#1F33B8">选中任意几行文字…</text>
    <text x="58" y="175" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="12.5" fill="#3D4A63">……然后松开鼠标。</text>
    <text x="156" y="222" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#5B6B8C">① 选中文字</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="324" y="64" width="232" height="176" rx="12" fill="#FFFFFF" stroke="#DFE6F2"/>
    <rect x="341" y="118" width="198" height="21" rx="4" fill="#BCD2FF"/>
    <text x="345" y="133" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="12.5" font-weight="600" fill="#1F33B8">选中任意几行文字…</text>
    <path d="M372 116 L368 108 M420 116 L424 108" stroke="#9FB2D6" stroke-width="1.5" stroke-linecap="round"/>
    <g filter="url(#lift)">
      <rect x="356" y="80" width="88" height="28" rx="14" fill="url(#pill)" stroke="#C7D2E8"/>
      <text x="370" y="99" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="14" font-weight="700" fill="#22304F">&#10077; 引用</text>
    </g>
    <text x="400" y="222" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#5B6B8C">② 点击「❝ 引用」</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="608" y="64" width="232" height="176" rx="12" fill="#FFFFFF" stroke="#DFE6F2"/>
    <rect x="624" y="82" width="200" height="120" rx="10" fill="#FBFCFE" stroke="#E2E8F4"/>
    <text x="638" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#37507E">&gt; 引用的第一行</text>
    <text x="638" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#37507E">&gt;</text>
    <text x="638" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#37507E">&gt; 引用的第二行</text>
    <rect x="652" y="163" width="2" height="16" fill="#4176E6"/>
    <text x="662" y="176" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="12.5" fill="#9AA7BE">直接输入你的问题…</text>
    <text x="684" y="222" font-family="-apple-system,'Segoe UI',Roboto,'PingFang SC',sans-serif" font-size="13" font-weight="600" fill="#5B6B8C">③ 引用进入输入框</text>
  </g>

  <line x1="278" y1="152" x2="316" y2="152" stroke="#8CA0C6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="562" y1="152" x2="600" y2="152" stroke="#8CA0C6" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
